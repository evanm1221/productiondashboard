<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Studio Board V2</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
<style>
body{margin:0}[hidden]{display:none!important}
/* Layout: one 16:9 screen, unattended. Navy masthead, then one of three rotating screens:
   Today (sets down the side, the working day across), Week (projects as bars across days), Crew (people down the side).
   Colour carries meaning: shooter = blue, talent = light, blocking = red, heads up = yellow, open = green. Dark only. */
:root{
  color-scheme:dark;
  --blue:#38a4fe; --blue-d:#1f7fd6; --blue-ink:#74c0ff; --navy:#0C1E31; --hero:#13314f;
  --ink:#f2f5f8; --body-c:#bcc6cf; --gray:#96a3ae;
  --red:#fc2c37; --red-ink:#ff9aa0; --red-bg:#3a1418; --yellow:#ffbb00; --yellow-ink:#ffd968; --yellow-bg:#33290b;
  --green:#1f9d55; --green-ink:#72dc9f; --green-bg:#0f2e1f;
  --bg:#07111c; --strip:#0b1724; --surface:#0f1e2e; --block:#15324e; --line:#1e3246; --line-2:#30485e; --mute-bg:#152433;
  --talent:#e1e8ef; --talent-ink:#0C1E31;
  --font:"Geist",-apple-system,blinkmacsystemfont,"Segoe UI",helvetica,arial,sans-serif;
  --r:8px; --r-lg:12px; --r-xl:16px; --pill:999px; --label-w:11.5rem;
}
html{font-size:clamp(11px,min(.8333vw,1.4815vh),26px);height:100%}
body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:1rem;line-height:1.35;-webkit-font-smoothing:antialiased;cursor:none}
*,*::before,*::after{box-sizing:border-box}
h1,h2,h3,p,ul{margin:0} ul{padding:0;list-style:none}
svg.ic{width:1.2em;height:1.2em;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.board{height:100%;display:flex;flex-direction:column;gap:.9rem;pointer-events:none;padding-block:1.3rem .8rem;
  padding-left:max(1.75rem,env(safe-area-inset-left,0px));padding-right:max(1.75rem,env(safe-area-inset-right,0px))}

/* masthead */
.mast{position:relative;overflow:hidden;flex:0 0 auto;background:var(--hero);border-radius:var(--r-xl);padding:1.15rem 1.75rem 1.3rem;display:flex;align-items:center;gap:2rem;flex-wrap:wrap}
.mast::after{content:"";position:absolute;left:0;right:0;bottom:0;height:.3rem;background:linear-gradient(90deg,var(--blue) 0 55%,var(--yellow) 55% 80%,var(--red) 80% 100%)}
.logo{display:block;height:2.1rem;width:auto;margin-bottom:.45rem}
.mast h1{font-size:1.4rem;font-weight:700;letter-spacing:-.01em;line-height:1.15}
.mast-date{flex:1;min-width:0;display:flex;align-items:center;gap:1rem;flex-wrap:wrap;padding-left:2rem;border-left:1px solid rgba(255,255,255,.18)}
.mast-date h2{font-size:2.8rem;font-weight:700;letter-spacing:-.02em;line-height:1.05}
.chip{display:inline-flex;align-items:center;padding:.3rem .85rem;border-radius:var(--pill);font-size:.85rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--yellow);color:var(--navy);white-space:nowrap}
.mast-side{display:flex;align-items:center;gap:1.5rem;flex-wrap:wrap}
.clock{font-size:2rem;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.sync{font-size:.85rem;color:rgba(255,255,255,.72);line-height:1.45;max-width:22rem}
.sync b{display:block;color:#fff;font-weight:600}
.sync.is-bad b{color:var(--yellow)}
.rot{display:flex;gap:.4rem}
.rot span{padding:.5rem 1.1rem;border-radius:var(--pill);border:1px solid rgba(255,255,255,.3);font-size:.95rem;font-weight:700;color:rgba(255,255,255,.7)}
.rot span.on{background:#fff;border-color:#fff;color:var(--navy)}

.main{flex:1;min-height:0;display:flex;flex-direction:column;gap:.8rem}
.tag{display:flex;align-items:center;gap:.4rem;font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gray)}
.pill{display:inline-flex;align-items:center;padding:.22rem .7rem;border-radius:var(--pill);font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.pill.s-booked{background:var(--blue);color:#fff}
.pill.s-open{background:var(--green);color:#fff}
.pill.s-noshoot{background:var(--red);color:#fff}
.pill.s-dark,.pill.s-none{background:var(--mute-bg);color:var(--gray)}
.pill.s-hold,.pill.s-tentative{background:var(--yellow);color:var(--navy)}
.people{display:flex;flex-wrap:wrap;gap:.3rem}
.person{display:inline-flex;align-items:baseline;gap:.4rem;padding:.12rem .6rem;border-radius:6px;font-size:1.15rem;font-weight:600;line-height:1.3;color:#fff;white-space:nowrap}
.person--shooter{background:var(--blue-d)}
.person--talent{background:var(--talent);color:var(--talent-ink)}
.person small{font-size:.62em;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.banner{flex:0 0 auto;display:flex;align-items:center;gap:1rem;padding:.7rem 1.25rem;border-radius:var(--r-lg);background:var(--hero);font-size:1.25rem;font-weight:700}

/* timeline (Today and Crew) */
.tl{flex:1;min-height:0;display:flex;flex-direction:column;gap:.4rem}
.tl-head{flex:0 0 auto;display:flex}
.tl-corner{flex:0 0 var(--label-w)}
.tl-axis{flex:1;position:relative;height:3.3rem}
.part{position:absolute;top:0;height:1.5rem;display:flex;align-items:center;justify-content:center;border-radius:var(--pill);background:var(--mute-bg);font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--body-c)}
.tick{position:absolute;bottom:0;transform:translateX(-50%);font-size:.9rem;font-weight:600;color:var(--gray);font-variant-numeric:tabular-nums;white-space:nowrap}
.tick:first-child{transform:none}.tick:last-child{transform:translateX(-100%)}
.tl-rows{flex:1;min-height:0;display:flex;flex-direction:column;gap:.5rem}
.tl-row{flex:1;min-height:0;display:flex}
.tl-label{flex:0 0 var(--label-w);display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:.4rem;padding-right:1rem}
.tl-label b{font-size:1.35rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;line-height:1.1}
.tl-label .person{font-size:1.5rem;padding:.2rem .8rem}
.tl-label .role{font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gray)}
.tl-track{flex:1;min-width:0;position:relative;border-radius:var(--r-lg);border:1px solid var(--line);overflow:hidden;
  background:linear-gradient(90deg,transparent 40%,rgba(0,0,0,.28) 40% 50%,transparent 50%),repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 10%),var(--surface)}
.now{position:absolute;top:0;bottom:0;width:2px;background:var(--yellow);z-index:3;opacity:.55}
.blk{position:absolute;padding:3px}
.blk-in{height:100%;overflow:hidden;display:flex;flex-direction:column;gap:.3rem;padding:.55rem .8rem;border-radius:var(--r);background:var(--block);border-left:.3rem solid var(--blue)}
.blk-top{display:flex;justify-content:space-between;align-items:baseline;gap:.6rem;white-space:nowrap}
.slot{font-size:.8rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--blue-ink);overflow:hidden;text-overflow:ellipsis}
.run{font-size:.8rem;font-weight:600;color:var(--body-c);overflow:hidden;text-overflow:ellipsis}
.blk-title{font-size:1.5rem;font-weight:700;line-height:1.15;letter-spacing:-.01em;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere}
.blk-car{display:flex;align-items:center;gap:.4rem;font-size:1.05rem;color:var(--body-c);white-space:nowrap;overflow:hidden}
.blk-car span{overflow:hidden;text-overflow:ellipsis}
.blk.narrow .blk-title{font-size:1.1rem;-webkit-line-clamp:3}
.blk.narrow .person{font-size:.95rem;padding:.05rem .4rem}
.blk.narrow .blk-in{padding:.4rem .5rem;gap:.2rem}
.blk.narrow .run,.blk.narrow .blk-car{display:none}
.blk.short .blk-title{font-size:1.2rem;-webkit-line-clamp:1}
.blk.short .blk-car{display:none}
.blk.short.narrow .blk-title{font-size:1rem;-webkit-line-clamp:2}
.blk.short.narrow .slot{font-size:.7rem;letter-spacing:.04em}
.blk.short.narrow .people{flex-wrap:nowrap;overflow:hidden}
.blk.short.narrow .person{font-size:.8rem}
.blk.is-offcam .blk-in{background:var(--surface);border:1.5px dashed var(--line-2);border-left:.3rem solid var(--gray)}
.blk.is-offcam .slot{color:var(--body-c)}
.blk.is-tent .blk-in{border-left-color:var(--yellow)}
.blk.is-tent .slot{color:var(--yellow-ink)}
.blk.is-noshoot .blk-in,.blk.is-clash .blk-in{background:var(--red-bg);border-left-color:var(--red)}
.blk.is-noshoot .slot,.blk.is-clash .slot{color:var(--red-ink)}
.blk.is-noshoot .blk-title{color:var(--red-ink)}
.blk.is-open .blk-in{background:var(--green-bg);border:1.5px dashed var(--green);justify-content:center}
.blk.is-open .blk-title{color:var(--green-ink)}
.blk.is-dark .blk-in{background:var(--mute-bg);border-left-color:var(--line-2);justify-content:center}
.blk.is-dark .blk-title{color:var(--gray)}
.blk.is-free .blk-in{background:transparent;border:1.5px dashed var(--line-2);justify-content:center;align-items:center}
.blk.is-free .blk-title{font-size:1rem;font-weight:600;color:var(--gray)}

/* today's bottom strip */
.strip{flex:0 0 auto;display:flex;gap:.8rem;max-height:11.5rem}
.call{flex:1;min-width:0;overflow:hidden;display:flex;flex-direction:column;gap:.3rem;padding:.65rem .95rem;border-radius:var(--r-lg);border:1.5px solid var(--line-2);background:var(--surface)}
.call li{font-size:1.1rem;line-height:1.3;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.call li b{font-weight:700}
.call li em{font-style:normal;font-weight:700;color:var(--gray);margin-right:.5rem;font-size:.8em;letter-spacing:.08em;text-transform:uppercase}
.call--block{background:var(--red-bg);border-color:var(--red)} .call--block .tag,.call--block li{color:var(--red-ink)} .call--block li em{color:var(--red-ink);opacity:.8}
.call--note{background:var(--yellow-bg);border-color:var(--yellow)} .call--note .tag,.call--note li{color:var(--yellow-ink)} .call--note li em{color:var(--yellow-ink);opacity:.8}

/* week */
.week{flex:1;min-height:0;display:grid;grid-template-columns:9rem repeat(5,minmax(0,1fr));grid-template-rows:auto repeat(var(--n,4),minmax(0,1fr));gap:.5rem}
.wk-day{display:flex;align-items:baseline;gap:.5rem;padding:.45rem .85rem;border-radius:var(--r);border:1.5px solid var(--line-2);background:var(--surface)}
.wk-day b{font-size:1.15rem;font-weight:700}
.wk-day span{font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gray)}
.wk-day.is-today{background:#1d4a75;border-color:#1d4a75}
.wk-day.is-today span{color:var(--yellow)}
.wk-set{display:flex;align-items:center;font-size:1.1rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
.bar{min-width:0;min-height:0;overflow:hidden;display:flex;flex-direction:column;border-radius:var(--r);background:var(--block);border-left:.3rem solid var(--blue)}
.bar-head{flex:0 0 auto;display:flex;justify-content:space-between;align-items:baseline;gap:1rem;padding:.5rem .8rem .35rem}
.bar-head b{font-size:1.35rem;font-weight:700;line-height:1.15;letter-spacing:-.01em;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.bar-head span{flex:0 0 auto;font-size:.85rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--blue-ink);white-space:nowrap}
.bar-days{flex:1;min-height:0;display:grid;gap:.5rem}
.bar-day{min-width:0;overflow:hidden;display:flex;flex-direction:column;gap:.3rem;padding:.35rem .8rem .5rem;border-top:1px solid rgba(255,255,255,.1)}
.bar-day.is-today{background:rgba(56,164,254,.16)}
.bar-day .slot{color:var(--body-c)}
.bar-day .flagline{font-size:.85rem;font-weight:700;color:var(--red-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-day .flagline.is-note{color:var(--yellow-ink)}
.bar.is-idle{align-items:center;justify-content:center;text-align:center;gap:.2rem;padding:.5rem}
.bar.is-idle b{font-size:1.3rem;font-weight:700}
.bar.is-idle span{font-size:.95rem;color:var(--body-c)}
.bar.s-open{background:var(--green-bg);border:1.5px dashed var(--green)} .bar.s-open b{color:var(--green-ink)}
.bar.s-noshoot{background:var(--red-bg);border-left-color:var(--red)} .bar.s-noshoot b{color:var(--red-ink)}
.bar.s-dark,.bar.s-none{background:var(--mute-bg);border-left-color:var(--line-2)} .bar.s-dark b,.bar.s-none b{color:var(--gray)}
.bar.is-offcam{background:var(--surface);border:1.5px dashed var(--line-2);border-left:.3rem solid var(--gray)}
.bar.is-multi{background:var(--surface);border:1px solid var(--line);border-left:.3rem solid var(--blue);gap:.35rem;padding:.45rem .7rem}
.mb{min-width:0;display:flex;flex-direction:column;gap:.15rem}
.mb b{font-size:1.05rem;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mb .person{font-size:.9rem;padding:.02rem .4rem}
.bar.is-multi.is-today,.bar.is-idle.is-today{box-shadow:inset 0 0 0 2px var(--blue)}

.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6rem;text-align:center;border:1px dashed var(--line-2);border-radius:var(--r-lg);background:var(--surface);padding:2rem}
.empty b{font-size:1.9rem;font-weight:700}
.empty p{font-size:1.15rem;color:var(--body-c);max-width:46ch}
.foot{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;font-size:.85rem;color:var(--gray)}
.legend{display:flex;gap:1.1rem;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:.4rem;font-weight:600;color:var(--body-c)}
.legend i{width:.8rem;height:.8rem;border-radius:3px}
@media (max-width:760px){
  html{font-size:13px;height:auto} body{height:auto}
  .board{height:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .mast-date{padding-left:0;border-left:0;flex-basis:100%}.mast-date h2{font-size:2rem}
  :root{--label-w:6.5rem}
  .tl-row{min-height:9rem}.strip{flex-direction:column;max-height:none}
  .week{overflow-x:auto;grid-template-columns:6rem repeat(5,minmax(11rem,1fr));grid-template-rows:auto repeat(var(--n,4),10rem)}
}
</style>
</head>

/* ---------- dates and clock times ---------- */
function pad(n){return (n<10?"0":"")+n}
function keyOf(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function fromKey(k){var p=k.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function addDays(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n)}
function monday(d){return addDays(d,-((d.getDay()+6)%7))}

function cellDate(v){
  if(typeof v==="number"&&v>20000&&v<80000){var u=new Date(Math.round((v-25569)*864e5));return new Date(u.getUTCFullYear(),u.getUTCMonth(),u.getUTCDate())}
  var g=String(v==null?"":v).match(/^Date\((\d+),(\d+),(\d+)/); if(g)return new Date(+g[1],+g[2],+g[3]);
  var m=String(v==null?"":v).match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/); if(!m)return null;
  var y=+m[3]; if(y<100)y+=2000; return new Date(y,+m[1]-1,+m[2]);
}
function clk(t,bare){var h=Math.floor(t),m=Math.round((t-h)*60),h12=h%12||12;return h12+(m?":"+pad(m):"")+(bare?"":(h<12?" AM":" PM"))}
function clkRange(a,b){return clk(a,(a<12)===(b<12))+"–"+clk(b)}
function parseClock(str,hint){
  var m=String(str).trim().match(/^(\d{1,2})(?::(\d{2}))?\s*(a|am|p|pm)?\.?$/i); if(!m)return null;
  var h=+m[1],mi=m[2]?+m[2]:0,mer=m[3]?m[3].charAt(0).toLowerCase():(hint||"");
  if(h>23||mi>59)return null;
  if(mer==="p"&&h<12)h+=12; else if(mer==="a"&&h===12)h=0; else if(!mer&&h<8)h+=12;
  return {t:h+mi/60,mer:m[3]?mer:""};
}
function mkSlot(kind,a,b,label){return {kind:kind,start:a,end:b,label:label,key:a+"-"+b}}
function partSlot(k){return mkSlot(k,DAYPART[k][0],DAYPART[k][1],k==="am"?"Morning":k==="pm"?"Afternoon":"All day")}
/* Reads a time label however it was typed: AM, PM only, All Day, 9:30AM - 10:30AM, 2p - 3p, After 5pm, End of day... */
function parseSlot(label){
  var l=String(label||"").trim().replace(/[.,;]+$/,"").replace(/,?\s*(roughly|ish|approx\.?)$/i,"").trim().toLowerCase();
  if(!l)return null;
  if(/^(am|morning)(\s+only)?$/.test(l))return partSlot("am");
  if(/^(pm|afternoon)(\s+only)?$/.test(l))return partSlot("pm");
  if(/^all[\s-]?day$/.test(l))return partSlot("all");
  if(/^(eod|end of (the )?day)$/.test(l))return {kind:"move",at:DAYPART.all[1],label:"End of day"};
  if(/^top of (the )?day$/.test(l))return {kind:"move",at:DAYPART.all[0],label:"Top of day"};
  if(/^mid[\s-]?day$/.test(l))return {kind:"move",at:12,label:"Midday"};
  var a=l.match(/^after\s+(.+)$/),c,e,s;
  if(a){c=parseClock(a[1],"p"); if(c)return mkSlot("range",c.t,Math.min(c.t+1,AXIS[1]),"After "+clk(c.t))}
  var r=l.split(/\s*(?:-|–|—|\bto\b)\s*/);
  if(r.length===2){ e=parseClock(r[1]); s=parseClock(r[0],e&&e.mer);
    if(s&&e){ if(s.t>=e.t&&!s.mer)s.t-=12; if(s.t<e.t)return mkSlot("range",s.t,e.t,clkRange(s.t,e.t)) } }
  if(r.length===1){ c=parseClock(l); if(c&&/[ap]m?$|:/.test(l))return mkSlot("range",c.t,Math.min(c.t+1,AXIS[1]),clk(c.t)) }
  return null;
}
/* Splits a cell into lines, pulling a leading time label ("AM:", "2p - 3p:") or trailing "(PM)" off each one. */
function segments(text){
  var out=[];
  String(text||"").split("\n").forEach(function(line){
    line=line.trim(); if(!line)return;
    var s=parseSlot(line); if(s){out.push({slot:s,text:""});return}
    var re=/:(\s+|$)/g,m;
    while((m=re.exec(line))){ s=parseSlot(line.slice(0,m.index)); if(s){out.push({slot:s,text:line.slice(m.index+1).trim()});return} }
    m=line.match(/^(.*?)\s*\((am|pm)\)$/i); if(m){out.push({slot:partSlot(m[2].toLowerCase()),text:m[1].trim()});return}
    m=line.match(/^(.*?)\s*[-–]\s*(\d{1,2}(?::\d{2})?\s*(?:a|p|am|pm))$/i);
    if(m){ var c=parseClock(m[2]); if(c){out.push({slot:null,startAt:c.t,text:m[1].trim()});return} }
    out.push({slot:null,text:line});
  });
  return out;
}

function people(text){

      tok=tok.trim().replace(/[.;]+$/,""); if(!tok||/^(tbd|n\/?a)$/i.test(tok))return;
      var p={name:tok,post:post,role:role,off:false};

function parseSchedule(rows){

        for(x=i;x<=j;x++){ var cb=cells[x].blocks[0],fl=cells[x].flags.filter(function(f){return f!=="No shooter available"});
          h+='<div class="bar-day'+(keys[x]===tk?" is-today":"")+'">'+((cb.slot.kind!=="all"&&!(cb.slot.kind==="unset"&&fl.length))?'<span class="slot">'+esc(cb.slot.kind==="range"?cb.slot.label:cb.slot.label)+'</span>':"")
            +(cb.people.length?'<div class="people">'+cb.people.map(chip).join("")+'</div>':"")
            +(fl.length?'<div class="flagline">'+esc(fl.join(" · "))+'</div>':cells[x].tentative?'<div class="flagline is-note">Tentative</div>':"")+'</div>' }
        h+='</div></div>';
      }else{
        h+='<div class="bar is-multi'+(isT?" is-today":"")+'"'+pos+'>'+c.blocks.slice(0,3).map(function(b){
          return '<div class="mb"><span class="slot">'+esc(b.slot.kind==="range"?b.slot.label:b.slot.label)+'</span><b>'+esc(b.noshoot?"No shooter available":b.shoot||"Shoot not listed")+'</b>'+(b.people.length?'<div class="people">'+b.people.map(chip).join("")+'</div>':"")+'</div>'}).join("")+'</div>';
      }
      i=j+1;
    }
  });
  return h+'</div>';
}
function stamp(t){var d=new Date(t);return (keyOf(d)===todayKey()?"":fmt(d,{weekday:"short"})+" ")+fmtTime(t)}
function renderSync(){
  var el=$("sync"),b,sub;
  if(state.err&&!state.busy){var c=errorCopy(state.err);b=c[0];sub=c[1]+(state.lastAt?" Showing the schedule from "+stamp(state.lastAt)+".":"")}
  else if(state.lastAt){b="Updated "+stamp(state.lastAt);sub="Next refresh "+stamp(state.lastAt+REFRESH_MS)}
  else{b="Loading the schedule…";sub=""}
  el.className="sync"+(state.err&&!state.busy?" is-bad":"");
  el.innerHTML="<b>"+esc(b)+"</b><span>"+esc(sub)+"</span>";
}
function render(){
  var key=showKey(),d=fromKey(key),tk=todayKey(),chipEl=$("dateChip"),day=state.byKey[key],main=$("main"),i;
  $("title").textContent=state.title||"Studio Schedule";
  for(i=0;i<SCREENS.length;i++)$("rot-"+SCREENS[i][0]).className=state.screen===SCREENS[i][0]?"on":"";
  if(state.screen==="week"){ $("dateTitle").textContent="Week of "+fmt(monday(d),{month:"long",day:"numeric"}); chipEl.hidden=false; chipEl.textContent="By project" }
  else{ $("dateTitle").textContent=fmt(d,{weekday:"long",month:"long",day:"numeric"}); chipEl.hidden=false; chipEl.textContent=(state.screen==="crew"?"Crew · ":"")+(key===tk?"Today":"Next up") }
  renderSync();
  if(!state.days.length){
    var c=state.err&&!state.busy?errorCopy(state.err):["Loading the schedule…","Reading the production sheet."];
    main.innerHTML='<div class="empty"><b>'+esc(c[0])+'</b><p>'+esc(c[1])+'</p></div>';
  }else if(state.screen==="week")main.innerHTML=renderWeek();
  else if(!day)main.innerHTML='<div class="empty"><b>No schedule posted for this day</b><p>The sheet covers '+fmt(state.days[0].date,{month:"short",day:"numeric"})+" to "+fmt(state.days[state.days.length-1].date,{month:"short",day:"numeric"})+'.</p></div>';
  else main.innerHTML=state.screen==="crew"?renderCrew(day):renderToday(day);
}

/* ---------- unattended rotation ---------- */
var screenIx=0;
function rotate(){ screenIx=(screenIx+1)%SCREENS.length; state.screen=SCREENS[screenIx][0]; render(); setTimeout(rotate,SCREENS[screenIx][1]) }
function wake(){ try{ if(navigator.wakeLock)navigator.wakeLock.request("screen").catch(function(){}) }catch(e){} }
document.addEventListener("visibilitychange",function(){ if(!document.hidden){tick();wake()} });
try{ var saved=JSON.parse(localStorage.getItem(STORE)||"null"); if(saved&&saved.rows){applyRows(saved.rows);state.lastAt=saved.at||0} }catch(e){}
try{ var want=(location.hash||"").replace("#",""); for(var q=0;q<SCREENS.length;q++)if(SCREENS[q][0]===want){screenIx=q;state.screen=want} }catch(e){}
lastToday=todayKey(); render(); tick(); setInterval(tick,20000); wake(); load();
setTimeout(rotate,SCREENS[screenIx][1]);
})();
</script>
