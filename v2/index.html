<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Studio Board V2</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
<style>
body{margin:0}[hidden]{display:none!important}
/* Layout: one 16:9 screen, unattended, dark only. Navy masthead, a week strip, then one card per studio set.
   Each card stacks the set's time blocks (morning, afternoon, exact times); inside a block every kind of information
   keeps its own colour and icon: time = navy band, shooter = blue, talent = light, blocking = red, heads up = yellow, open = green. */
:root{
  color-scheme:dark;
  --blue:#38a4fe; --blue-d:#1f7fd6; --blue-ink:#74c0ff; --navy:#0C1E31; --hero:#13314f; --sel:#1d4a75;
  --ink:#f2f5f8; --body-c:#bcc6cf; --gray:#96a3ae;
  --red:#fc2c37; --red-ink:#ff9aa0; --red-bg:#3a1418; --yellow:#ffbb00; --yellow-ink:#ffd968; --yellow-bg:#33290b;
  --green:#1f9d55; --green-ink:#72dc9f; --green-bg:#0f2e1f;
  --bg:#07111c; --strip:#0c1826; --surface:#0f1e2e; --line:#1e3246; --line-2:#30485e; --tint:#12304d; --mute-bg:#152433;
  --talent:#e1e8ef; --talent-ink:#0C1E31;
  --font:"Geist",-apple-system,blinkmacsystemfont,"Segoe UI",helvetica,arial,sans-serif;
  --r:8px; --r-lg:12px; --r-xl:16px; --pill:999px;
}
html{font-size:clamp(11px,min(.8333vw,1.4815vh),26px);height:100%}
body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:1rem;line-height:1.35;-webkit-font-smoothing:antialiased;cursor:none}
*,*::before,*::after{box-sizing:border-box}
h1,h2,h3,p,ul{margin:0} ul{padding:0;list-style:none}
svg.ic{width:1.2em;height:1.2em;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.board{height:100%;display:flex;flex-direction:column;gap:.9rem;pointer-events:none;padding-block:1.3rem .8rem;
  padding-left:max(1.75rem,env(safe-area-inset-left,0px));padding-right:max(1.75rem,env(safe-area-inset-right,0px))}

/* masthead */
.mast{position:relative;overflow:hidden;flex:0 0 auto;background:var(--hero);border-radius:var(--r-xl);padding:1.15rem 1.75rem 1.3rem;display:flex;align-items:center;gap:2rem;flex-wrap:wrap}
.mast::after{content:"";position:absolute;left:0;right:0;bottom:0;height:.3rem;background:linear-gradient(90deg,var(--blue) 0 55%,var(--yellow) 55% 80%,var(--red) 80% 100%)}
.logo{display:block;height:2.1rem;width:auto;margin-bottom:.45rem}
.mast h1{font-size:1.4rem;font-weight:700;letter-spacing:-.01em;line-height:1.15}
.mast-date{flex:1;min-width:0;display:flex;align-items:center;gap:1rem;flex-wrap:wrap;padding-left:2rem;border-left:1px solid rgba(255,255,255,.18)}
.mast-date h2{font-size:2.8rem;font-weight:700;letter-spacing:-.02em;line-height:1.05}
.chip{display:inline-flex;align-items:center;padding:.3rem .85rem;border-radius:var(--pill);font-size:.85rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--yellow);color:var(--navy);white-space:nowrap}
.mast-side{display:flex;align-items:center;gap:1.5rem;flex-wrap:wrap}
.clock{font-size:2rem;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.sync{font-size:.85rem;color:rgba(255,255,255,.72);line-height:1.45;max-width:22rem}
.sync b{display:block;color:#fff;font-weight:600}
.sync.is-bad b{color:var(--yellow)}
.rot{display:flex;gap:.4rem}
.rot span{padding:.5rem 1.1rem;border-radius:var(--pill);border:1px solid rgba(255,255,255,.3);font-size:.95rem;font-weight:700;color:rgba(255,255,255,.7)}
.rot span.on{background:#fff;border-color:#fff;color:var(--navy)}

/* week strip */
.days{flex:0 0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.6rem}
.day{display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding:.55rem 1rem;border:1.5px solid var(--line-2);border-radius:var(--r-lg);background:var(--surface)}
.day b{display:block;font-size:1.15rem;font-weight:700;line-height:1.15}
.day .sub{display:block;font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gray)}
.day.is-on{background:var(--sel);border-color:var(--sel)}
.day.is-on .sub{color:var(--yellow)}
.day.is-empty b{color:var(--gray)}
.dots{display:flex;gap:.3rem}
.dot{width:.65rem;height:.65rem;border-radius:50%;background:#9aa5b1;flex:0 0 auto}
.dot.s-booked{background:var(--blue)} .dot.s-tentative,.dot.s-hold{background:var(--yellow)} .dot.s-open{background:var(--green)} .dot.s-noshoot{background:var(--red)}

.main{flex:1;min-height:0;display:flex;flex-direction:column;gap:.8rem}
.tag{display:flex;align-items:center;gap:.4rem;font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gray)}
.pill{display:inline-flex;align-items:center;padding:.3rem .85rem;border-radius:var(--pill);font-size:.9rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.pill.s-booked{background:var(--blue);color:#fff}
.pill.s-open{background:var(--green);color:#fff}
.pill.s-noshoot{background:var(--red);color:#fff}
.pill.s-dark,.pill.s-none{background:var(--mute-bg);color:var(--gray)}
.pill.s-hold,.pill.s-tentative{background:var(--yellow);color:var(--navy)}
.people{display:flex;flex-wrap:wrap;gap:.35rem}
.person{display:inline-flex;align-items:baseline;gap:.4rem;padding:.15rem .7rem;border-radius:6px;font-size:1.45rem;font-weight:600;line-height:1.3;color:#fff;overflow-wrap:anywhere}
.person--shooter{background:var(--blue-d)}
.person--talent{background:var(--talent);color:var(--talent-ink)}
.person small{font-size:.6em;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.8;white-space:nowrap}
.banner{flex:0 0 auto;display:flex;align-items:center;gap:1rem;padding:.7rem 1.25rem;border-radius:var(--r-lg);background:var(--hero);font-size:1.25rem;font-weight:700}

/* day view: one card per set */
.sets{flex:1;min-height:0;display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:1rem}
.set{min-width:0;min-height:0;display:flex;flex-direction:column;border:1px solid var(--line);border-top:.35rem solid var(--line-2);border-radius:var(--r-lg);background:var(--surface);overflow:hidden}
.set.s-booked{border-top-color:var(--blue)} .set.s-tentative,.set.s-hold{border-top-color:var(--yellow)} .set.s-noshoot{border-top-color:var(--red)}
.set.s-open{border-top-color:var(--green);background:var(--green-bg)} .set.s-dark{background:var(--mute-bg)}
.set-head{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding:.8rem 1.2rem;border-bottom:1px solid var(--line)}
.set-head h3{font-size:1.4rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.set-body{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:.8rem;padding:1rem 1.2rem}
.blocks{flex:0 1 auto;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:.8rem}
.blk{flex:0 0 auto;display:flex;flex-direction:column;gap:.65rem}
.blk + .blk{padding-top:.8rem;border-top:1px dashed var(--line-2)}
.when{display:flex;align-items:center;gap:.6rem;padding:.5rem .85rem;border-radius:var(--r);background:var(--sel);font-size:1.35rem;font-weight:700;line-height:1.2}
.when svg{color:var(--yellow)}
.when span{flex:1;min-width:0}
.when i{font-style:normal;font-weight:500;color:rgba(255,255,255,.75);margin-left:.5rem;font-size:.85em;white-space:nowrap}
.when em{flex:0 0 auto;font-style:normal;font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:.15rem .55rem;border-radius:var(--pill);background:var(--yellow);color:var(--navy)}
.when em.off{background:transparent;border:1px solid rgba(255,255,255,.45);color:#fff}
.blk.is-now .when{background:var(--blue-d)}
.what{font-size:2.1rem;font-weight:700;line-height:1.15;letter-spacing:-.015em;overflow-wrap:anywhere}
.runline{display:flex;align-items:center;gap:.45rem;font-size:1rem;font-weight:600;color:var(--blue-ink)}
.row{display:grid;grid-template-columns:2.4rem minmax(0,1fr);gap:.75rem;align-items:start}
.row-ic{width:2.4rem;height:2.4rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.1rem}
.row--shooter .row-ic{background:var(--tint);color:var(--blue-ink)} .row--shooter .tag{color:var(--blue-ink)}
.row--talent .row-ic{background:#22384d;color:var(--ink)} .row--talent .tag{color:var(--ink)}
.row--car .row-ic{background:var(--mute-bg);color:var(--gray)}
.row .people{margin-top:.25rem}
.car{font-size:1.35rem;font-weight:500;line-height:1.3;overflow-wrap:anywhere;margin-top:.1rem}
.detail{font-size:1.1rem;color:var(--body-c)}
.blk.is-noshoot .what{color:var(--red-ink)}
.blk.is-offcam .when{background:var(--mute-bg)}
/* two blocks on a card: tighter */
.set.n2 .what{font-size:1.55rem} .set.n2 .when{font-size:1.15rem;padding:.4rem .75rem} .set.n2 .person{font-size:1.2rem}
.set.n2 .row{grid-template-columns:2rem minmax(0,1fr);gap:.6rem;align-items:center} .set.n2 .row-ic{width:2rem;height:2rem;font-size:.95rem}
.set.n2 .row .tag,.set.n3 .row .tag{display:none} .set.n2 .row .people,.set.n3 .row .people{margin-top:0}
.set.n2 .car{font-size:1.15rem;margin-top:0} .set.n2 .blk{gap:.5rem}
/* three or more: compact */
.set.n3 .what{font-size:1.25rem} .set.n3 .when{font-size:1rem;padding:.3rem .65rem} .set.n3 .person{font-size:1.05rem;padding:.08rem .5rem}
.set.n3 .row{grid-template-columns:1.6rem minmax(0,1fr);gap:.5rem;align-items:center} .set.n3 .row-ic{width:1.6rem;height:1.6rem;font-size:.8rem}
.set.n3 .car{font-size:1rem;margin-top:0} .set.n3 .blk{gap:.35rem} .set.n3 .blocks,.set.n3 .set-body{gap:.55rem} .set.n3 .blk + .blk{padding-top:.55rem}
.set.n3 .runline,.set.n3 .detail{font-size:.9rem}

.calls{flex:0 0 auto;display:flex;flex-direction:column;gap:.5rem;margin-top:auto}
.call{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.6rem;padding:.55rem .8rem;border-radius:var(--r);font-size:1.12rem;line-height:1.3;border:1.5px solid var(--line-2);background:var(--strip)}
.call svg{font-size:1.15rem;margin-top:.15em}
.call li{font-weight:600;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;overflow-wrap:anywhere}
.call li b{color:var(--blue-ink)}
.call--block{background:var(--red-bg);border-color:var(--red);color:var(--red-ink)} .call--block .tag{color:var(--red-ink)} .call--block svg{color:var(--red)}
.call--note{background:var(--yellow-bg);border-color:var(--yellow);color:var(--yellow-ink)} .call--note .tag{color:var(--yellow-ink)} .call--note li{font-weight:500}
.idle{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4rem;text-align:center}
.idle b{font-size:2.5rem;font-weight:700;letter-spacing:-.015em}
.idle span{font-size:1.2rem;color:var(--body-c)}
.idle-ic{width:4rem;height:4rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.8rem;margin-bottom:.4rem;background:#22384d;color:var(--gray)}
.set.s-open .idle b{color:var(--green-ink)} .set.s-open .idle-ic{background:var(--green);color:#fff}
.set.s-noshoot .idle b{color:var(--red-ink)} .set.s-noshoot .idle-ic{background:var(--red);color:#fff}
.set.s-dark .idle b,.set.s-none .idle b{color:var(--gray)}
.next{flex:0 0 auto;display:flex;flex-direction:column;gap:.2rem;padding:.7rem 1.2rem .85rem;border-top:1px solid var(--line);background:var(--strip)}
.next .tag{gap:.5rem}
.next-what{font-size:1.25rem;font-weight:700;line-height:1.2;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere}
.next-who{font-size:1.05rem;color:var(--body-c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.next.s-open .next-what{color:var(--green-ink)} .next.s-noshoot .next-what{color:var(--red-ink)} .next.s-dark .next-what,.next.s-none .next-what{color:var(--gray)}

/* week view */
.week{flex:1;min-height:0;display:grid;grid-template-columns:8.5rem repeat(5,minmax(0,1fr));grid-template-rows:auto repeat(var(--n,4),minmax(0,1fr));gap:.5rem}
.wk-day{display:flex;align-items:baseline;gap:.5rem;padding:.45rem .85rem;border-radius:var(--r);border:1.5px solid var(--line-2);background:var(--surface)}
.wk-day b{font-size:1.15rem;font-weight:700}
.wk-day span{font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gray)}
.wk-day.is-today{background:var(--sel);border-color:var(--sel)} .wk-day.is-today span{color:var(--yellow)}
.wk-set{display:flex;align-items:center;font-size:1.05rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.cell{position:relative;min-width:0;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:.35rem;padding:.55rem .75rem;border:1px solid var(--line);border-left:.3rem solid var(--line-2);border-radius:var(--r);background:var(--surface)}
.cell.is-today{box-shadow:inset 0 0 0 2px var(--blue)}
.cell.s-booked{border-left-color:var(--blue)} .cell.s-tentative,.cell.s-hold{border-left-color:var(--yellow)} .cell.s-noshoot{border-left-color:var(--red)}
.cell.s-open{border-left-color:var(--green);background:var(--green-bg)} .cell.s-dark,.cell.s-none{background:var(--mute-bg)}
.cell.is-idle{align-items:center;justify-content:center;text-align:center}
.cell.is-idle b{font-size:1.25rem;font-weight:700}
.cell.is-idle span{font-size:.95rem;color:var(--body-c)}
.cell.s-open b{color:var(--green-ink)} .cell.s-noshoot.is-idle b{color:var(--red-ink)} .cell.s-dark b,.cell.s-none b{color:var(--gray)}
.cb{min-width:0;display:flex;flex-direction:column;gap:.25rem}
.cb + .cb{padding-top:.35rem;border-top:1px dashed var(--line-2)}
.cb-top{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;white-space:nowrap;padding-right:1.5rem}
.slot{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--yellow-ink);overflow:hidden;text-overflow:ellipsis}
.runtag{font-size:.78rem;font-weight:700;color:var(--blue-ink)}
.cb-what{font-size:1.25rem;font-weight:700;line-height:1.2;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere}
.cb.is-noshoot .cb-what{color:var(--red-ink)}
.cell .person{font-size:.95rem;padding:.04rem .45rem}
.cell .people{gap:.25rem;max-height:3.2rem;overflow:hidden}
.cell.m2 .cb-what,.cell.m3 .cb-what{font-size:1rem;-webkit-line-clamp:1}
.cell.m2 .person,.cell.m3 .person{font-size:.82rem}
.cell.m3 .people{display:none}
.cell-car{display:flex;align-items:center;gap:.35rem;font-size:.92rem;color:var(--body-c);white-space:nowrap;overflow:hidden;margin-top:auto}
.cell-car span{overflow:hidden;text-overflow:ellipsis}
.flag{position:absolute;top:.45rem;right:.45rem;width:1.3rem;height:1.3rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:700}
.flag--block{background:var(--red);color:#fff} .flag--note{background:var(--yellow);color:var(--navy)}

.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6rem;text-align:center;border:1px dashed var(--line-2);border-radius:var(--r-lg);background:var(--surface);padding:2rem}
.empty b{font-size:1.9rem;font-weight:700}
.empty p{font-size:1.15rem;color:var(--body-c);max-width:46ch}
.foot{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;font-size:.85rem;color:var(--gray)}
.legend{display:flex;gap:1.1rem;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:.4rem;font-weight:600;color:var(--body-c)}
.legend i{width:.8rem;height:.8rem;border-radius:3px}
@media (max-width:760px){
  html{font-size:14px;height:auto} body{height:auto}
  .board{height:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .mast-date{padding-left:0;border-left:0;flex-basis:100%}.mast-date h2{font-size:2rem}
  .days{grid-template-columns:1fr 1fr}
  .sets{grid-template-columns:1fr}.set-body,.blocks{overflow:visible}.idle{padding-block:1.5rem}
  .week{display:flex;flex-direction:column}.wk-day{display:none}.wk-set{padding-top:.6rem}.cell{min-height:5rem}
}
</style>
</head>
<body>
<div class="board">

/* ---------- dates and clock times ---------- */
function pad(n){return (n<10?"0":"")+n}
function keyOf(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function fromKey(k){var p=k.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function addDays(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n)}

function cellDate(v){
  if(typeof v==="number"&&v>20000&&v<80000){var u=new Date(Math.round((v-25569)*864e5));return new Date(u.getUTCFullYear(),u.getUTCMonth(),u.getUTCDate())}
  var g=String(v==null?"":v).match(/^Date\((\d+),(\d+),(\d+)/); if(g)return new Date(+g[1],+g[2],+g[3]);
  var m=String(v==null?"":v).match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/); if(!m)return null;
  var y=+m[3]; if(y<100)y+=2000; return new Date(y,+m[1]-1,+m[2]);
}
function clk(t,bare){var h=Math.floor(t),m=Math.round((t-h)*60),h12=h%12||12;return h12+(m?":"+pad(m):"")+(bare?"":(h<12?" AM":" PM"))}
function clkRange(a,b){return clk(a,(a<12)===(b<12))+"–"+clk(b)}
function parseClock(str,hint){
  var m=String(str).trim().match(/^(\d{1,2})(?::(\d{2}))?\s*(a|am|p|pm)?\.?$/i); if(!m)return null;
  var h=+m[1],mi=m[2]?+m[2]:0,mer=m[3]?m[3].charAt(0).toLowerCase():(hint||"");
  if(h>23||mi>59)return null;
  if(mer==="p"&&h<12)h+=12; else if(mer==="a"&&h===12)h=0; else if(!mer&&h<8)h+=12;
  return {t:h+mi/60,mer:m[3]?mer:""};
}
function mkSlot(kind,a,b,label){return {kind:kind,start:a,end:b,label:label,key:a+"-"+b}}
function partSlot(k){return mkSlot(k,DAYPART[k][0],DAYPART[k][1],k==="am"?"Morning":k==="pm"?"Afternoon":"All day")}
/* Reads a time label however it was typed: AM, PM only, All Day, 9:30AM - 10:30AM, 2p - 3p, After 5pm, End of day... */
function parseSlot(label){
  var l=String(label||"").trim().replace(/[.,;]+$/,"").replace(/,?\s*(roughly|ish|approx\.?)$/i,"").trim().toLowerCase();
  if(!l)return null;
  if(/^(am|morning)(\s+only)?$/.test(l))return partSlot("am");
  if(/^(pm|afternoon)(\s+only)?$/.test(l))return partSlot("pm");
  if(/^all[\s-]?day$/.test(l))return partSlot("all");
  if(/^(eod|end of (the )?day)$/.test(l))return {kind:"move",at:DAYPART.all[1],label:"End of day"};
  if(/^top of (the )?day$/.test(l))return {kind:"move",at:DAYPART.all[0],label:"Top of day"};
  if(/^mid[\s-]?day$/.test(l))return {kind:"move",at:12,label:"Midday"};
  var a=l.match(/^after\s+(.+)$/),c,e,s;
  if(a){c=parseClock(a[1],"p"); if(c)return mkSlot("range",c.t,Math.min(c.t+1,AXIS[1]),"After "+clk(c.t))}
  var r=l.split(/\s*(?:-|–|—|\bto\b)\s*/);
  if(r.length===2){ e=parseClock(r[1]); s=parseClock(r[0],e&&e.mer);
    if(s&&e){ if(s.t>=e.t&&!s.mer)s.t-=12; if(s.t<e.t)return mkSlot("range",s.t,e.t,clkRange(s.t,e.t)) } }

}
/* Splits a cell into lines, pulling a leading time label ("AM:", "2p - 3p:") or trailing "(PM)" off each one. */
function segments(text){
  var out=[];

function people(text){

function clean(v){v=(v==null?"":String(v)).replace(/\r/g,"").split("\n").map(function(l){return l.replace(/[ \t]+/g," ").trim()}).filter(Boolean).join("\n");
  v=v.replace(/^\*+\s*|\s*\*+$/g,""); return /^n\/?a\.?$/i.test(v)?"":v}

  if(/^who/.test(label))return "who"; if(/^what/.test(label))return "what"; if(/^car/.test(label))return "car";

  if(s.car&&s.car.toLowerCase()===s.what.toLowerCase())s.car="";
  if(/^off[\s-]?cam(era)?(\s+(wrenching|work))?\.?$/i.test(s.notes)){out.offNote=true;s.notes=""}

function parseSchedule(rows){

function load(){
  if(state.busy)return; state.busy=true; renderSync();
  fetchRows().then(function(rows){
    applyRows(rows); state.lastAt=Date.now(); state.err=null; state.failAt=0;
    try{localStorage.setItem(STORE,JSON.stringify({rows:rows,at:state.lastAt}))}catch(e){}
  }).catch(function(e){

}
var lastToday="",lastQuarter=-1;
function tick(){

  var tk=keyOf(now); if(tk!==lastToday){lastToday=tk;render()}
  if(!state.busy&&(!state.failAt||now-state.failAt>RETRY_MS)&&(!state.lastAt||state.err||now-state.lastAt>=REFRESH_MS))load();

    main.innerHTML='<div class="empty"><b>'+esc(c[0])+'</b><p>'+esc(c[1])+'</p></div>';
  }else if(state.screen==="week")main.innerHTML=renderWeek();
  else if(!day)main.innerHTML='<div class="empty"><b>No schedule posted for this day</b><p>The sheet covers '+fmt(state.days[0].date,{month:"short",day:"numeric"})+" to "+fmt(state.days[state.days.length-1].date,{month:"short",day:"numeric"})+'.</p></div>';
  else main.innerHTML=renderDay(day,key===tk);
}

/* ---------- unattended rotation ---------- */
var screenIx=0;
function rotate(){ screenIx=(screenIx+1)%SCREENS.length; state.screen=SCREENS[screenIx][0]; render(); setTimeout(rotate,SCREENS[screenIx][1]) }
function wake(){ try{ if(navigator.wakeLock)navigator.wakeLock.request("screen").catch(function(){}) }catch(e){} }
document.addEventListener("visibilitychange",function(){ if(!document.hidden){tick();wake()} });
try{ var saved=JSON.parse(localStorage.getItem(STORE)||"null"); if(saved&&saved.rows){applyRows(saved.rows);state.lastAt=saved.at||0} }catch(e){}
try{ var want=(location.hash||"").replace("#",""); for(var q=0;q<SCREENS.length;q++)if(SCREENS[q][0]===want){screenIx=q;state.screen=want} }catch(e){}
lastToday=todayKey(); render(); tick(); setInterval(tick,20000); wake(); load();
setTimeout(rotate,SCREENS[screenIx][1]);
})();
</script>
